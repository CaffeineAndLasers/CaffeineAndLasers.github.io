<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LNP Policy Generator</title>
<style>
:root{color-scheme:dark;--gold:#ffcf4a;--cream:#fff2cb;--red:#e83c42;--navy:#111a3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(ellipse at top,#26365b 0,#11152c 60%,#090c19 100%);font-family:Arial,sans-serif;color:var(--cream)}.machine{width:min(900px,100%);border:7px solid #d2a438;border-radius:28px;background:#111b3d;box-shadow:0 0 0 4px #493012,0 20px 70px #000a;overflow:hidden}.marquee{text-align:center;background:#b72134;border-bottom:7px solid #d2a438;padding:20px 12px 17px;position:relative}.marquee:before,.marquee:after{content:'✦ ✦ ✦ ✦ ✦ ✦ ✦';display:block;color:#ffdb63;letter-spacing:8px;font-size:13px}.marquee:after{margin-top:9px}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;font-weight:bold;color:#ffe59a;margin:4px}.marquee h1{font-family:Georgia,serif;text-transform:uppercase;line-height:.95;font-size:clamp(2rem,7vw,4.5rem);margin:6px 0;text-shadow:3px 4px #67101c}.marquee h1 span{display:block;color:#ffd664}.body{padding:25px clamp(14px,4vw,38px) 28px;text-align:center}.instruction{margin:0 0 21px;text-transform:uppercase;letter-spacing:.18em;font-size:.75rem;color:#bfc7de}.sentence{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-family:Georgia,serif;font-weight:bold;font-size:clamp(1.05rem,2.2vw,1.35rem)}.reel{display:flex;align-items:center;justify-content:center;width:clamp(160px,22vw,225px);min-height:104px;padding:12px;background:linear-gradient(#d5c7a4,#fff9e8 26%,#fff9e8 73%,#c6b68e);color:#162247;border:5px solid #b9903e;border-radius:8px;box-shadow:inset 0 4px 10px #0003,0 3px 0 #5c4019;font:800 1.05rem/1.2 Arial,sans-serif;overflow:hidden}.reel.spinning span{animation:spin .13s linear infinite}@keyframes spin{0%{transform:translateY(-35px);opacity:.25}50%{transform:translateY(0);opacity:1}100%{transform:translateY(35px);opacity:.25}}.controls{margin-top:29px}.home-link{position:fixed;right:20px;bottom:20px;padding:12px 18px;border:2px solid #ffdf76;border-radius:999px;background:#b9182e;box-shadow:0 4px 12px #0008;color:#fff;font-size:.8rem;font-weight:bold;text-decoration:none;text-transform:uppercase;letter-spacing:.12em}.home-link:hover{background:#f6534d;color:#fff}button{border:3px solid #ffdf76;border-radius:50px;background:linear-gradient(#f6534d,#b9182e);box-shadow:0 6px 0 #731322,0 9px 14px #0006;color:white;text-transform:uppercase;letter-spacing:.12em;font-weight:900;font-size:1.1rem;padding:15px 48px;cursor:pointer;min-height:54px}button:hover{filter:brightness(1.12)}button:active{transform:translateY(4px);box-shadow:0 2px 0 #731322}button:focus-visible{outline:3px solid white;outline-offset:5px}button:disabled{opacity:.65;cursor:wait}.fineprint{color:#aeb8d1;font-size:.75rem;line-height:1.5;margin:24px 0 0}.fineprint strong{color:#f1d78e}@media(max-width:600px){.sentence{flex-direction:column;gap:5px}.reel{width:min(100%,310px);min-height:62px}.body{padding-top:18px}.controls{margin-top:20px}}@media(prefers-reduced-motion:reduce){.reel.spinning span{animation:none}}
</style>
</head>
<body><main class="machine"><header class="marquee"><p class="eyebrow">The Canberra policy pokies</p><h1>LNP Policy <span>Generator</span></h1></header><section class="body"><div class="sentence" aria-live="polite" aria-atomic="true"><span>To solve</span><div class="reel" id="problem"><span>[Problem]</span></div><span>sell</span><div class="reel" id="resource"><span>[Public Resource]</span></div><span>to</span><div class="reel" id="corporation"><span>[Private Corporation]</span></div></div><div class="controls"><button id="generate" type="button">Generate</button></div><a class="home-link" href="/">Home Page</a></section></main>
<script>
const resources=['Medicare','the ABC','Australia Post','the NBN','public schools','the Great Barrier Reef','national parks','public hospitals','the CSIRO','the Murray–Darling Basin','Centerlink'];
const corporations=['Qantas','BHP','Rio Tinto','Telstra','Woodside','News Corp','Macquarie Group','Coles','Woolworths','Gina Rinehart’s Hancock Prospecting', 'Coronation Property'];
const problems=['the housing crisis','the cost of living','climate change','rural GP shortages','the budget deficit','traffic on the M1','rising power bills','youth unemployment','the rental crisis','the price of a schooner', 'Gambling Epidemic'];
const lists=[problems,resources,corporations];
const reels=['problem','resource','corporation'].map(id=>document.getElementById(id));
const button=document.getElementById('generate');
const sample=list=>list[Math.floor(Math.random()*list.length)];
button.addEventListener('click',()=>{
  button.disabled=true;
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){reels.forEach((reel,i)=>reel.firstElementChild.textContent=sample(lists[i]));button.disabled=false;return;}
  reels.forEach((reel,i)=>{
    reel.classList.add('spinning');
    const timer=setInterval(()=>{reel.firstElementChild.textContent=sample(lists[i]);},80);
    setTimeout(()=>{clearInterval(timer);reel.firstElementChild.textContent=sample(lists[i]);reel.classList.remove('spinning');if(i===reels.length-1)button.disabled=false;},750+i*350);
  });
});
</script></body></html>
